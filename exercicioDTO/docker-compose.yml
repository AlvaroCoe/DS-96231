version: '3.8'

services:
  db-mysql:
    image: mysql:8.0
    container_name: mysql_container_projeto
    restart: always
    environment:
      MYSQL_DATABASE: db_atividade
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
